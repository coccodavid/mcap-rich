[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcap-rich"
version = "0.1.0"
description = "A rich visual wrapper for the mcap CLI tool"
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0"
]

[project.scripts]
mcap-rich = "mcap_rich:main"
